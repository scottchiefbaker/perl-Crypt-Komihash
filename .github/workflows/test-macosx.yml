name: test-macosx

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*'
  pull_request:

permissions:
  contents: read

jobs:
  perl:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: configure
        run: perl Makefile.PL
      - name: build
        run: make
      - name: test
        run: make test
